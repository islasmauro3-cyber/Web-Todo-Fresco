{% extends "base.html" %}
{% block title %}Acceso – Mis Ventas{% endblock %}

{% block content %}
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-shop-window text-primary" style="font-size:3rem;"></i>
    <h4 class="mt-2 fw-bold">Mis Ventas</h4>
    <p class="text-muted small">Panel de gestión</p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2 small">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control form-control-lg"
             placeholder="••••••••" autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="bi bi-unlock me-1"></i>Entrar
    </button>
  </form>
</div>
{% endblock %}
