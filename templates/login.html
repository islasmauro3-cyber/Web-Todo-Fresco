{% extends "base.html" %}
{% block title %}Acceso – Todo Fresco{% endblock %}

{% block content %}
<div class="login-box">
  <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='images/IMG_8495.png') }}"
         style="height:70px; width:auto;" alt="Todo Fresco"
         onerror="this.style.display='none'">
    <h4 class="mt-2 fw-bold" style="font-family:'Anton',sans-serif; color:var(--tf-red);">
      TODO FRESCO
    </h4>
    <p class="text-muted small">Panel de gestión</p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2 small">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control form-control-lg"
             placeholder="••••••••" autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="bi bi-unlock me-1"></i>Entrar
    </button>
  </form>
</div>
{% endblock %}
